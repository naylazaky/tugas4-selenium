name: Selenium Tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest -n 2 -v --html=report.html --self-contained-html
        env:
          HEADLESS: "1"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.html